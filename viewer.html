  psdScale={}; pfpScale={}; summaryLock={};          // recompute locked colours for the new sensor
  warmCancel();                  // the old sensor's prefetch is now dead weight
  requestData();                                     // paint new sensor's summary now
  checkPsd(); checkPfp();                             // availability flags load in parallel
});
document.getElementById('reset').addEventListener('click', ()=>{
  view={t0:meta.tmin,t1:meta.tmax}; resetFreq(); layoutTimeSlider(); requestData();
});

// ---- Export: current view + key stats -> a single shareable PNG ---------
// `supplied` = an already-composed heatmap bitmap (the full-extent strip);
// `ov` overrides the window/layer facts the table reports, because those come
// from the bitmap that was rendered, not from whatever is on screen.
function exportPNG(supplied, ov){
  if (!meta || (!supplied && !cv.width)) return null;
  ov = ov || {};
  // In rotated mode the plot lives across two layers -- the turned heatmap
  // canvas and the upright label canvas -- so flatten them into one bitmap in
  // screen orientation, or the export would come out unlabelled.
  let src = supplied || cv;
  if (!supplied && rotated){
    const f=document.createElement('canvas');
    f.width=cv.height; f.height=cv.width;              // screen orientation
    const fg=f.getContext('2d');
    fg.translate(f.width/2, f.height/2); fg.rotate(-Math.PI/2);   // match the CSS turn
    fg.drawImage(cv, -cv.width/2, -cv.height/2);
    fg.setTransform(DPR,0,0,DPR,0,0);
    fg.font='11px ui-sans-serif'; fg.textBaseline='middle';
    for (const L of rotLabels){                        // the DOM labels, redrawn
      fg.fillStyle=L.color;
      fg.textAlign = L.shift.startsWith('translate(-100%') ? 'right'
                   : L.shift.startsWith('translate(-50%') ? 'center' : 'left';
      // DOM anchors by the span's box; canvas by the baseline. translate(..,0)
      // hangs the text below the point, translate(..,-100%) sits it above.
      fg.fillText(L.text, L.sx,
                  L.shift.endsWith(',0)') ? L.sy+6 :
                  L.shift.endsWith('-100%)') ? L.sy-5 : L.sy);
    }
    src = f;
  }
  const M=26, W=1320;
  // A supplied strip is rendered at the size it is meant to be read at, so fit
  // it inside the page width WITHOUT enlarging: blowing a 420 px strip up to
  // 1268 only softens every column it took the trouble to render sharply.
  const avail = W - 2*M;
  const scale = supplied ? Math.min(1, avail / src.width) : avail / src.width;
  const hmW = Math.round(src.width * scale), hmH = Math.round(src.height * scale);
  const hmX = M + Math.round((avail - hmW) / 2);
  const unit=document.getElementById('unit').textContent;
  const lo = (ov.vmin !== undefined && ov.vmin !== null) ? ov.vmin.toFixed(0)
           : document.getElementById('lo').textContent;
  const hi = (ov.vmax !== undefined && ov.vmax !== null) ? ov.vmax.toFixed(0)
           : document.getElementById('hi').textContent;
  const lk = ov.kind || layerMode;
  const layerName = lk==='iq' ? 'IQ capture STFT spectrogram'
                  : lk==='pfp' ? 'PFP frame (~18 µs, folded 10 ms frame)'
                  : lk==='psd' ? 'PSD (2250 bins @ 80 kHz)'
                  : 'Summary (channel power, ~90 s sweeps)';
  const et0 = ov.t0 !== undefined ? ov.t0 : view.t0;
  const et1 = ov.t1 !== undefined ? ov.t1 : view.t1;
  const ef0 = ov.f0 !== undefined ? ov.f0 : viewF.f0;
  const ef1 = ov.f1 !== undefined ? ov.f1 : viewF.f1;
  const rows=[];
  const srcName = (mode==='iq' && iqCap) ? iqCap.name : sensor;
  rows.push([mode==='iq' ? 'Capture' : 'Sensor', srcName]);
  if (mode==='iq' && iqCap) rows.push(['Capture params',
    (iqCap.fc/1e6).toFixed(3)+' MHz centre · '+(iqCap.fs/1e6).toFixed(2)+' Msps · '+iqCap.duration.toFixed(2)+' s · '+iqCap.dataset]);
  rows.push(['Layer', layerName + (lk==='summary' ? '   ·   statistic: '+stat : '')]);
  if (ov.note) rows.push(['Extent', ov.note]);
  rows.push(['Time window (UTC)', fmtTs(et0)+'   →   '+fmtTs(et1)]);
  rows.push(['Time span', fmtSpan(et1-et0)]);
  if (!supplied && layerMode==='pfp' && pfpView){
    rows.push(['Channel', (pfpView.freq/1e6).toFixed(0)+' MHz']);
    rows.push(['Frame structure', pfpView.npos+' pts over '+pfpFrameMs+' ms  (~'+(pfpFrameMs*1000/pfpView.npos).toFixed(1)+' µs/pt)']);
    rows.push(['Captures in view', String(pfpView.ncap)]);
  } else {
    rows.push(['Frequency window', (ef0/1e6).toFixed(3)+' MHz   →   '+(ef1/1e6).toFixed(3)+' MHz']);
    if (!supplied && layerMode==='psd' && psdView) rows.push(['Captures in view', psdView.ncap+'  (× 2250 freq bins)']);
    else if (!supplied && data) rows.push(['Detail level', data.level+'   ('+data.count.toLocaleString()+' cells)']);
  }
  rows.push(['Colour scale', lo+'  …  '+hi+'  '+unit]);
  rows.push(['Colormap', cmapName.charAt(0).toUpperCase()+cmapName.slice(1)]);
  rows.push(['Sensor data range', fmtTs(meta.tmin)+'   →   '+fmtTs(meta.tmax)]);
  rows.push(['Exported (UTC)', new Date().toISOString().replace('T',' ').slice(0,19)]);

  const rowH=26, titleH=58, legH=46, sepGap=16;
  const H = M + titleH + 14 + hmH + 16 + legH + sepGap + rows.length*rowH + M;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const g=c.getContext('2d');
  g.fillStyle='#0b0d12'; g.fillRect(0,0,W,H);
  let y=M;
  g.textBaseline='top'; g.textAlign='left';
  g.fillStyle='#dde2ea'; g.font='bold 24px ui-sans-serif, system-ui, Segoe UI, sans-serif';
  g.fillText('RF Spectrum Viewer: '+srcName, M, y);
  g.fillStyle='#97a0b2'; g.font='14px ui-sans-serif';
  g.fillText(layerName, M, y+32);
  y += titleH+14;
  g.imageSmoothingEnabled=true; g.imageSmoothingQuality='high';
  g.drawImage(src, hmX, y, hmW, hmH);
  g.strokeStyle='#262e40'; g.lineWidth=1; g.strokeRect(hmX+0.5, y+0.5, hmW, hmH);
  y += hmH+16;
  const cb=document.getElementById('cbar'), lgW=240;
  g.drawImage(cb, M, y, lgW, 14); g.strokeRect(M+0.5, y+0.5, lgW, 14);
  g.fillStyle='#97a0b2'; g.font='12px ui-monospace, monospace'; g.textBaseline='top';
  g.textAlign='left'; g.fillText('low  '+lo+' '+unit, M, y+18);
  g.textAlign='right'; g.fillText(hi+' '+unit+'  high', M+lgW, y+18);
  g.textAlign='left';
  y += legH+sepGap;
  g.strokeStyle='#262e40'; g.beginPath(); g.moveTo(M,y-8); g.lineTo(W-M,y-8); g.stroke();
  g.textBaseline='middle';
  for (const [k,v] of rows){
    g.fillStyle='#97a0b2'; g.font='13px ui-sans-serif'; g.textAlign='left';
    g.fillText(k, M, y+rowH/2);
    g.fillStyle='#dde2ea'; g.font='13px ui-monospace, ui-sans-serif, monospace';
    g.fillText(v, M+230, y+rowH/2);
    y += rowH;
  }
  // attribution, bottom-right, aligned with the last ("Exported") row
  g.fillStyle='#7a8499'; g.font='13px ui-sans-serif'; g.textAlign='right';
  g.fillText('Jimmy Lu 2026', W-M, y-rowH/2);
  g.textAlign='left';
  const fn = 'spectrum_'+srcName.replace(/[^A-Za-z0-9-]/g,'')+'_'+(ov.suffix?ov.suffix+'_':'')+new Date().toISOString().replace(/[:T]/g,'-').slice(0,19)+'.png';
  c.toBlob(b=>{ if(!b) return; const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=fn; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),5000); }, 'image/png');
  return c;
}
// ---- Export: choose what gets exported, not just when -------------------
// A view on screen is bounded by the window; a figure for a paper usually wants
// the WHOLE recording. Both are the same composition (heatmap + colour bar +
// the statistics table), so only the bitmap handed to it differs.
function withBand(f0, f1, fn){
  const keep = {f0: viewF.f0, f1: viewF.f1};
  viewF.f0 = f0; viewF.f1 = f1;
  try { return fn(); } finally { viewF.f0 = keep.f0; viewF.f1 = keep.f1; }
}
// One layer, one window, at a pixel size of our choosing, drawn as a tall strip
// with time down the long axis and the most recent at the top -- the same
// orientation as Time-on-Y, so an exported figure matches what was on screen.
async function renderStrip(t0, t1, f0, f1, stripW, stripH){
  const tileW = Math.min(2048, Math.max(256, Math.round(stripH / 1)));   // time samples
  const tileH = Math.max(256, Math.round(stripW * 3));                   // freq rows
  let url = null, kind = null;
  if (psdAvail){
    kind = 'psd';
    url = withWindow(t0, t1, () => withBand(f0, f1, () => psdUrl(tileW, tileH)));
  } else if (pfpAvail && channelInView()){
    kind = 'pfp';
    const ch = nearestChannelHz();
    url = withWindow(t0, t1, () => pfpUrl(ch, tileW, tileH));
  }
  const M = {l: 8, r: 92, t: 10, b: 46};
  const c = document.createElement('canvas');
  c.width = stripW + M.l + M.r; c.height = stripH + M.t + M.b;
  const g = c.getContext('2d');
  g.fillStyle = COL.chrome; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = COL.plotBg; g.fillRect(M.l, M.t, stripW, stripH);

  let drewLo = f0, drewHi = f1, note = '', vlo = null, vhi = null;
  if (url){
    const r = await fetch(url);
    if (!r.ok) throw new Error('the ' + kind.toUpperCase() + ' layer could not render '
                               + 'this window: HTTP ' + r.status);
    const j = JSON.parse(r.headers.get('X-Meta'));
    const img = await createImageBitmap(await r.blob());
    vlo = j.vmin; vhi = j.vmax;      // the scale THIS tile was coloured with
    if (kind === 'psd'){ drewLo = j.fmin; drewHi = j.fmax; }
    else note = (j.freq/1e6).toFixed(0) + ' MHz channel · frame position 0-'
                + (j.frame_ms || pfpFrameMs) + ' ms';
    g.save();
    g.beginPath(); g.rect(M.l, M.t, stripW, stripH); g.clip();
    g.imageSmoothingEnabled = false;
    // rotate(-90deg): the tile's time axis (its x) goes UP the strip, newest at
    // the top; its frequency axis (its y) goes across, low on the left.
    g.translate(M.l + stripW/2, M.t + stripH/2);
    g.rotate(-Math.PI/2);
    g.drawImage(img, -stripH/2, -stripW/2, stripH, stripW);
    g.restore();
    img.close && img.close();
  } else {
    g.fillStyle = COL.dim; g.font = '13px ui-sans-serif'; g.textAlign = 'center';
    g.fillText('no deep layer available for this sensor', c.width/2, M.t + stripH/2);
    g.textAlign = 'left';
  }

  // axes: dates down the right edge, MHz across the bottom
  g.font = '11px ui-sans-serif'; g.textBaseline = 'middle';
  g.strokeStyle = COL.grid; g.lineWidth = 1;
  const span = t1 - t0, nT = Math.max(2, Math.min(24, Math.round(stripH / 110)));
  g.fillStyle = COL.label; g.textAlign = 'left';
  for (let k = 0; k <= nT; k++){
    const fr = k / nT, t = t0 + fr * span;
    const y = M.t + stripH - fr * stripH;          // newest at the TOP
    g.beginPath(); g.moveTo(M.l, y); g.lineTo(M.l + stripW, y); g.stroke();
    g.fillText(fmtTs(t).slice(0, 16), M.l + stripW + 7, y);
  }
  g.textAlign = 'center'; g.textBaseline = 'top';
  const dec = (drewHi - drewLo) < 20e6 ? 2 : 0;
  for (let k = 0; k <= 4; k++){
    const fr = k / 4, x = M.l + fr * stripW;
    g.fillStyle = COL.label;
    g.fillText(((drewLo + fr*(drewHi-drewLo))/1e6).toFixed(dec),
               Math.max(M.l + 14, Math.min(M.l + stripW - 14, x)), M.t + stripH + 6);
  }
  g.fillStyle = COL.dim;
  g.fillText(note || 'Frequency (MHz)', M.l + stripW/2, M.t + stripH + 24);
  g.strokeStyle = '#262e40'; g.strokeRect(M.l + 0.5, M.t + 0.5, stripW, stripH);
  return {canvas: c, kind, t0, t1, f0: drewLo, f1: drewHi, vmin: vlo, vmax: vhi};
}

let exportBusy = false;
async function exportFullExtent(fullBand){
  if (exportBusy || !meta) return;
  exportBusy = true;
  const btn = document.getElementById('exportBtn');
  const label = btn.lastChild;
  const was = label.textContent;
  label.textContent = ' Rendering…';
  try {
    const f0 = fullBand ? BAND_F0 : viewF.f0, f1 = fullBand ? BAND_F1 : viewF.f1;
    const strip = await renderStrip(meta.tmin, meta.tmax, f0, f1, 420, 2048);
    exportPNG(strip.canvas, {
      t0: strip.t0, t1: strip.t1, f0: strip.f0, f1: strip.f1,
      vmin: strip.vmin, vmax: strip.vmax,
      kind: strip.kind, suffix: 'fullextent',
      note: 'Full recording, ' + (fullBand ? 'full band' : 'current band')
            + ' · 2048 px of time',
    });
  } catch (e){
    console.error('full-extent export:', e);
    layerNote = ' · export failed: ' + e.message;
    updateReadout();
  } finally {
    label.textContent = was; exportBusy = false;
  }
}

  resize();
});
document.getElementById('rotate').addEventListener('click', e=>{
  rotated = !rotated;
  applyPad();
  document.getElementById('bandGroup').hidden = !rotated;
  stage.classList.toggle('rot', rotated);
  e.currentTarget.setAttribute('aria-pressed', String(rotated));
  e.currentTarget.classList.toggle('active', rotated);
  if (rotated && meta){
    // Entering Time-on-Y opens on the WHOLE recording: the full time extent
    // down the long axis and the full band across, one tall strip, so the
    // shape of the entire dataset is visible before any zooming. Both axes
    // reset on purpose -- arriving here from a channel-zoomed view with only
    // an 8 MHz sliver showing is not "the entire recording".
    view.t0 = meta.tmin; view.t1 = meta.tmax; clampTimeView();
    resetFreq();
  }
  layoutSliders();
  resize();                       // re-render the scene for the swapped box
  if (rotated) requestData();     // fetch the full-span window just adopted
});
document.getElementById('cmap').addEventListener('change', e=>{
  cmapName = e.target.value;
  try { localStorage.setItem('cmap', cmapName); } catch(_){}
  drawLegend();
  if (layerMode==='summary'){ drawCrisp(); }          // summary is client-drawn; recolours instantly
  else { psdImg=null; pfpImg=null; iqImg=null; requestData(); }  // PSD/PFP/IQ tiles must re-render server-side
});

function drawLegend(){
  const c=document.getElementById('cbar'); c.width=120;c.height=12;
  const g=c.getContext('2d');
  for (let x=0;x<120;x++){ const col=cmap(x/119); g.fillStyle=`rgb(${col[0]},${col[1]},${col[2]})`; g.fillRect(x,0,1,12);} }
function setLegendUnit(u){ const e=document.getElementById('unit'); if (e) e.textContent=u; }
// PSD/PFP layers are stored max-only; median/mean apply to the summary layer
// only, so disable them (greyed) outside summary mode to keep the toggle honest.
function updateStatButtons(){
  // Summary always offers all three (they live in the same payload). The PSD
  // layer offers whichever statistics have a database on disk -- psd.duckdb is
  // max; psd_ingest.py --stat median/mean builds the siblings. PFP stays
  // max-only: only the max_peak trace is ingested.
  const perStat = s => layerMode==='summary' ? true
                     : layerMode==='psd' ? psdStats.includes(s)
                     : s==='max';
  let anyOff = false;
  document.querySelectorAll('[data-stat]').forEach(b=>{
    const on = perStat(b.dataset.stat);
    b.disabled = !on; anyOff = anyOff || !on;
    b.title = on ? '' :
      layerMode==='psd' ? `no ${b.dataset.stat} PSD database -- build one with: python ingest/psd_ingest.py <sensor> --stat ${b.dataset.stat}`
                        : 'the PFP layer stores the max_peak statistic only';
  });
  document.querySelector('.seg').classList.toggle('max-only', anyOff);
}



// ---- Boot -------------------------------------------------------------
function showNoBackend(){
  document.body.innerHTML =
    '<div style="display:flex;align-items:center;justify-content:center;height:100%;padding:30px;text-align:center">'
    + '<div><h2 style="color:#f0a500">⚠ No data server</h2>'
    + '<p style="color:#dde2ea">This page must be opened through the running server, not as a file.</p>'
    + '<p style="font-size:18px;color:#5f93ff">Open <b>http://localhost:8090</b> in your browser.</p></div></div>';
}

function showNoData(){
  document.body.innerHTML =
    '<div style="display:flex;align-items:center;justify-content:center;height:100%;padding:30px;text-align:center">'
    + '<div><h2 style="color:#f0a500">No spectrum data found</h2>'
    + '<p style="color:#dde2ea">The server is running, but there are no databases next to <b>serve.py</b>.</p>'
    + '<p style="font-size:16px;color:#5f93ff">Build the zero-download demo, then reload:</p>'
    + '<pre style="text-align:left;display:inline-block;background:#151922;padding:12px 16px;border-radius:8px;color:#dde2ea;font-size:14px">python examples/make_sample.py\npython serve.py</pre>'
    + '<p style="color:#8b93a3">See the README for the full CBRS / IQ datasets.</p></div></div>';
}

async function boot(){
  document.getElementById('cmap').value = cmapName;
  drawLegend();
  let r;
  try { r = await fetch('/api/meta'); if (!r.ok) throw new Error('bad status '+r.status); }
  catch(e){ showNoBackend(); return; }
  meta = await r.json();
  meta.freqs.sort((a,b)=>a-b);
  summaryAvail = meta.summary !== false;   // absent spectrum.duckdb -> PSD is the top layer
  const sel = document.getElementById('sensor');
  meta.sensors.forEach(s=>{ const o=document.createElement('option'); o.value=s.sensor; o.textContent=s.sensor; sel.appendChild(o); });
  new ResizeObserver(resize).observe(stage);
  const caps = await loadIqIndex();       // populate the Source dropdown; returns captures[]
  if (meta.sensors.length){
    sensor = meta.sensors[0].sensor;
    meta.tmin = meta.sensors[0].t_min; meta.tmax = meta.sensors[0].t_max;
    view = { t0: meta.tmin, t1: meta.tmax };
    resize(); requestData();              // paint the (full-span) summary immediately
    checkPsd(); checkPfp();               // availability flags load in parallel; don't block first paint
  } else if (caps.length){
    // No CBRS databases present (e.g. a fresh clone running only the IQ demo):
    // drop the CBRS option and open the first capture directly in IQ mode.
    const cbrsOpt = document.querySelector('#source option[value="cbrs"]');
    if (cbrsOpt) cbrsOpt.remove();
    document.getElementById('sensor').disabled = true;
    resize();
    document.getElementById('source').value = 'iq:'+caps[0].id;
    enterIqMode(caps[0].id);
  } else {
    showNoData();                         // server up, but no data at all
  }
}
async function loadIqIndex(){
  try{
    const j = await (await fetch('/api/iq_index')).json();
    const sel = document.getElementById('source');
    const caps = j.captures || [];
    caps.forEach(c=>{
      const o=document.createElement('option');
      o.value='iq:'+c.id;
      o.textContent=`IQ capture: ${c.name} (${c.dataset} · ${(c.fc/1e6).toFixed(0)} MHz · ${(c.fs/1e6).toFixed(2)} Msps · ${c.duration.toFixed(1)} s)`;
      sel.appendChild(o);
    });
    return caps;
  }catch(e){ return []; }
}
async function checkPsd(){
  psdAvail = false;
  try { const j = await (await fetch('/api/psd_meta?sensor='+enc(sensor))).json();
        if (mode==='cbrs'){ psdAvail = !!j.has; psdStats = j.stats || ['max'];
          // A stat whose database vanished (sensor change) must not stay
          // selected: tiles for it would 503. Fall back to max quietly.
          if (layerMode==='psd' && !psdStats.includes(stat)) setStat('max');
          updateStatButtons(); } }
  // A probe that fails leaves the layer switched off for this sensor with
  // nothing on screen to say so, which is indistinguishable from there being
  // no PSD data at all. Say it once, in the console and in the readout.
  catch(e){ console.warn('psd_meta probe failed:', e.message); layerNote=' · PSD layer probe failed: '+e.message; }
  // Availability lands after the first paint, so re-ask: buildReq() decides
  // whether this view wants the layer, on either axis. Testing the time span
  // here as well was a second copy of that rule, and it was the stale one.
  if (mode==='cbrs' && psdAvail) { layoutSliders(); requestData(); }
}
async function checkPfp(){
  pfpAvail = false; pfpFreqs = [];
  try { const j = await (await fetch('/api/pfp_meta?sensor='+enc(sensor))).json();
        if (mode==='cbrs'){ pfpAvail = !!j.has; if (j.frame_ms) pfpFrameMs=j.frame_ms;
          // The channels this sensor really has. Guessing them from a formula
          // is how the frame layer ended up asking for centres that were not in
          // the database and getting 404s for every one of them.
          if (Array.isArray(j.freqs)) pfpFreqs = j.freqs; } }
  catch(e){ console.warn('pfp_meta probe failed:', e.message); }
  if (mode==='cbrs' && pfpAvail) { layoutSliders(); requestData(); }
}
boot();
// IQ capture mode: header "Source" dropdown switches between CBRS monitoring
// and independent IQ captures (own time/frequency axes per capture).
